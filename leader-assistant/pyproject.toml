[project]
name = "leader-assistant"
version = "0.1.0"
description = "An IM assistant that retrieves knowledge and answers project questions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.116",
    "gradio>=6.20.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx2>=0.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
leader-assistant = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
