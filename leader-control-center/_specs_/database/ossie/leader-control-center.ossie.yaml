metrics:
- name: attention_queue_size
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(CASE WHEN human_request.status IN ('Created', 'Visible', 'Acknowledged') THEN 1 END)
  datatype: Integer
  description: Open Human Requests awaiting a Decision (the Attention Queue).
  ai_context:
    synonyms:
    - open decisions
    - pending approvals
    - inbox size
- name: high_priority_attention
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(CASE WHEN human_request.status IN ('Created', 'Visible', 'Acknowledged') AND human_request.priority
        = 'high' THEN 1 END)
  datatype: Integer
  description: Open high-priority Human Requests.
- name: decision_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(decision.id)
  datatype: Integer
  description: Decisions recorded (immutable).
- name: decision_latency_avg
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(decision.created_at - human_request.created_at)
  datatype: Opaque
  description: Mean pause-to-decision interval (INTERVAL; dialect-specific epoch extraction needed for seconds).
  ai_context:
    synonyms:
    - time to decision
    - human response time
- name: story_execution_count
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(story_execution.id)
  datatype: Integer
  description: Story executions (runs).
- name: story_executions_waiting
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(CASE WHEN story_execution.status = 'Waiting' THEN 1 END)
  datatype: Integer
  description: Runs blocked on a human.
- name: story_execution_success_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN story_execution.status = 'Completed' THEN 1.0 ELSE 0 END) / NULLIF(COUNT(CASE WHEN story_execution.status
        IN ('Completed', 'Failed', 'Cancelled') THEN 1 END), 0)
  datatype: Float
  description: Completed / terminal story executions.
  ai_context:
    synonyms:
    - success rate
    - completion rate
- name: task_execution_failure_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN task_execution.status = 'Failed' THEN 1.0 ELSE 0 END) / NULLIF(COUNT(CASE WHEN task_execution.status
        IN ('Completed', 'Failed', 'Cancelled') THEN 1 END), 0)
  datatype: Float
  description: Failed / terminal task executions.
- name: provider_success_rate
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: SUM(CASE WHEN provider_execution.status = 'Succeeded' THEN 1.0 ELSE 0 END) / NULLIF(COUNT(CASE WHEN provider_execution.status
        IN ('Succeeded', 'Failed', 'Cancelled') THEN 1 END), 0)
  datatype: Float
  description: Succeeded / terminal provider attempts; compare providers for the same capability.
- name: provider_attempts_avg
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: AVG(provider_execution.attempt)
  datatype: Float
  description: Mean attempt number per provider execution (retry pressure).
- name: human_requests_per_execution
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(human_request.id) * 1.0 / NULLIF(COUNT(DISTINCT story_execution.id), 0)
  datatype: Float
  description: Human interventions per run (autonomy indicator).
- name: artifacts_produced
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(artifact.id)
  datatype: Integer
  description: Artifact versions produced.
- name: schedule_runs_failed_to_start
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(CASE WHEN schedule_run.status = 'FailedToStart' THEN 1 END)
  datatype: Integer
  description: Occurrences that could not create a Story.
- name: schedule_runs_missed
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(CASE WHEN schedule_run.status IN ('Missed', 'Skipped') THEN 1 END)
  datatype: Integer
  description: Occurrences skipped by overlap policy or missed outside the catch-up window.
- name: unread_notifications
  expression:
    dialects:
    - dialect: ANSI_SQL
      expression: COUNT(CASE WHEN notification.read = FALSE THEN 1 END)
  datatype: Integer
  description: Unread notifications.
custom_extensions:
- vendor_name: LEADER_CONTROL_CENTER
  data: '{"spec":"_specs_/database/data-model.md","storage_overlay":"backend/storage.md","mvp_physical":"SQLite aggregates(collection,
    id, ord, data JSON) at ../data/leader-control-center.db","local_sources":"canonical-named SQL views over aggregates resolve
