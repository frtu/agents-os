description: 'Semantic/ontology layer for the Leader Control Center canonical storage model (_specs_/database/data-model.md):
  a human-in-the-loop control plane supervising durable AI workflows. Sources name the canonical normalized tables; the as-built
  SQLite realization of each dataset is in its LEADER_CONTROL_CENTER extension (mvp).'
ai_context:
  instructions: Planning (initiative > epic > story > task) is immutable intent; Runtime (story_execution > task_execution
    > capability_execution > provider_execution) is disposable; history (event, decision, artifact) is permanent. Capability
    = what, execution strategy = how, provider = who. Every pause is a human_request and each yields exactly one decision.
    The Attention Queue is the set of open human_requests. Planning never references Runtime.
  synonyms:
  - LCC
  - supervision console
  - control plane
  examples:
  - How many approvals are waiting, by initiative?
  - What is the mean time to decision this week?
  - Which provider has the best success rate for the Code Review capability?
  - Which schedules failed to start a story in the last 24 hours?
